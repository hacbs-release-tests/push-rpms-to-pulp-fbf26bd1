---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: '{{ source_url }}/-/tree/{{ revision }}'
    build.appstudio.redhat.com/commit_sha: '{{ revision }}'
    build.appstudio.redhat.com/pull_request_number: '{{ pull_request_number }}'
    build.appstudio.redhat.com/target_branch: '{{ target_branch }}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: push-rpms-app-fbf26bd1
    appstudio.openshift.io/component: push-rpms-to-pulp-fbf26bd1
    pipelines.appstudio.openshift.io/type: build
  name: push-rpms-to-pulp-fbf26bd1-on-pull-request
  namespace: dev-release-team-tenant
spec:
  params:
    - name: ociStorage
      value: >-
        quay.io/redhat-user-workloads-stage/dev-release-team-tenant/push-rpms-to-pulp-fbf26bd1:pr{{pull_request_number}}-{{revision}}
    - name: package-name
      value: hello
    - name: git-url
      value: "{{ source_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: target-branch
      value: "{{ target_branch }}"
    - name: build-architectures
      value: ["x86_64", "aarch64"]
    - name: build-platforms
      value: ["linux/amd64", "linux/arm64", "localhost"]
    - name: mock-config-template-filename-in-sources
      value: "mock.cfg"
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: "https://github.com/konflux-ci/rpmbuild-pipeline.git"
      - name: revision
        value: main
      - name: pathInRepo
        value: pipeline/build-rpm-package.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-push-rpms-to-pulp-fbf26bd1
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
